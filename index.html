<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Autocorrect Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #1a73e8;
            margin-top: 0;
            font-size: 24px;
            text-align: center;
        }
        p {
            color: #5f6368;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
            color: #3c4043;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .output-box {
            background-color: #f8f9fa;
            border: 1px solid #e8eaed;
            padding: 15px;
            border-radius: 8px;
            min-height: 50px;
            font-size: 16px;
            color: #202124;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI-Powered Autocorrect Engine</h1>
    <p>Improve text accuracy and fluency instantly.</p>
    
    <label for="input-text">Type your custom typos here:</label>
    <textarea id="input-text" placeholder="try typing: 'the cat sat on the mat want to eat apple' with some typos like 'caat' or 'appl'"></textarea>
    
    <label>✨ Fixed Output:</label>
    <div id="output-text" class="output-box">Your corrected text will appear here as you type...</div>
</div>

<script>
    // Our built-in vocabulary dictionary
    const vocabulary = new Set(["the", "cat", "car", "hat", "rat", "sat", "mat", "apple", "kitty", "house", "want", "eat", "fly", "drive"]);

    function generateEdits(word) {
        const letters = 'abcdefghijklmnopqrstuvwxyz';
        const edits = new Set();
        
        // Splits
        for (let i = 0; i <= word.length; i++) {
            const L = word.slice(0, i);
            const R = word.slice(i);
            
            // Deletes
            if (R.length > 0) edits.add(L + R.slice(1));
            
            // Swaps
            if (R.length > 1) edits.add(L + R[1] + R[0] + R.slice(2));
            
            // Replaces
            if (R.length > 0) {
                for (let c of letters) {
                    edits.add(L + c + R.slice(1));
                }
            }
            
            // Inserts
            for (let c of letters) {
                edits.add(L + c + R);
            }
        }
        return edits;
    }

    function autocorrectWord(word) {
        word = word.toLowerCase().trim();
        if (!word) return "";
        
        // If it's already spelled right
        if (vocabulary.has(word)) return word;
        
        // Generate edits
        const candidates = generateEdits(word);
        const validCandidates = Array.from(candidates).filter(w => vocabulary.has(w));
        
        // Return first match or original if none found
        return validCandidates.length > 0 ? validCandidates[0] : word;
    }

    function processSentence() {
        const input = document.getElementById('input-text').value;
        const words = input.split(/(\s+)/); // Keep spaces
        
        const correctedWords = words.map(chunk => {
            // Check if it's a word or just spacing
            if (chunk.trim() === "") return chunk;
            
            // Separate punctuation
            const match = chunk.match(/^([.,!?]*)(.*?)([.,!?]*)$/);
            const leadingPunct = match[1];
            const coreWord = match[2];
            const trailingPunct = match[3];
            
            return leadingPunct + autocorrectWord(coreWord) + trailingPunct;
        });
        
        document.getElementById('output-text').innerText = correctedWords.join("");
    }

    // Run the function in real-time as the user types
    document.getElementById('input-text').addEventListener('input', processSentence);
</script>

</body>
</html>
